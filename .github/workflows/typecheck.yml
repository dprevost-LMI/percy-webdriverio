name: Typecheck
on: push
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (wdio ${{ matrix.wdio }})
    strategy:
      fail-fast: false
      matrix:
        wdio: [8, 9, 10]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: v1/${{ runner.os }}/node-22/wdio-${{ matrix.wdio }}/${{ hashFiles('**/yarn.lock') }}
          restore-keys: v1/${{ runner.os }}/node-22/wdio-${{ matrix.wdio }}/
      - name: Install dependencies (webdriverio 10, from yarn.lock)
        if: ${{ matrix.wdio == 10 }}
        run: yarn install --frozen-lockfile
      - name: Install dependencies (webdriverio ${{ matrix.wdio }})
        if: ${{ matrix.wdio != 10 }}
        env:
          WDIO: ${{ matrix.wdio }}
        run: >-
          yarn add --dev --ignore-engines
          "webdriverio@^$WDIO" "@wdio/cli@^$WDIO" "@wdio/local-runner@^$WDIO"
          "@wdio/jasmine-framework@^$WDIO" "@wdio/spec-reporter@^$WDIO"
      - run: yarn test:types
